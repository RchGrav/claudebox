name: Test ClaudeBox

on:
  push:
    branches: [ main, refactor ]
  pull_request:
    branches: [ main ]

jobs:
  test-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Run portable shell tests
      run: |
        for test_script in tests/test_*.sh; do
          case "$test_script" in
            tests/test_in_bash32_docker.sh|tests/test_*integration.sh)
              continue
              ;;
          esac
          /bin/bash "$test_script"
        done

    - name: Test clipboard protocol
      run: |
        python3 -m unittest discover -s tests -p test_clipboard_server.py
        node --test tests/test_clipboard_client.js
        
    - name: Run Docker shell tests (Linux only)
      if: runner.os == 'Linux'
      run: |
        /bin/bash tests/test_in_bash32_docker.sh
        if [ -f tests/test_docker_runtime.sh ]; then
          /bin/bash tests/test_docker_runtime.sh
        fi
        
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Run ShellCheck with baseline
      run: |
        shellcheck --severity=error build/docker-entrypoint build/init-firewall
        bash tooling/ci/shellcheck-baseline.sh \
          main.sh \
          lib/*.sh \
          .builder/*.sh \
          tests/test_*.sh
      
  build:
    runs-on: ubuntu-latest
    needs: [test-compatibility, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build installer
      run: |
        bash .builder/build.sh
        
    - name: Verify installer was created
      run: |
        test -f dist/claudebox.run
        test -n "$(find dist -maxdepth 1 -name 'claudebox-*.tar.gz' -print -quit)"
        test -L claudebox.run
        echo "Installer size: $(ls -lh dist/claudebox.run | awk '{print $5}')"
        
    - name: Test installer in temporary directory
      run: |
        TEST_HOME=$(mktemp -d)
        trap 'rm -rf "$TEST_HOME"' EXIT
        export HOME="$TEST_HOME"
        /bin/bash ./dist/claudebox.run profiles
        test -f "$HOME/.claudebox/source/main.sh"
        test -L "$HOME/.local/bin/claudebox"
        "$HOME/.local/bin/claudebox" profiles
        /bin/bash "$HOME/.claudebox/source/tests/test_bash32_compat.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_cli_bash32.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_command_sync.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_docker_runtime.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_dockerfile_generation.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_runtime_regressions.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_profile_download_failure.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_dockerfile_template.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_slot_selection.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_clipboard_lifecycle.sh"
        /bin/bash "$HOME/.claudebox/source/tests/test_clipboard_firewall.sh"
        python3 -m unittest discover -s "$HOME/.claudebox/source/tests" -p test_clipboard_server.py
        node --test "$HOME/.claudebox/source/tests/test_clipboard_client.js"
        
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: claudebox-installer
        path: |
          dist/claudebox.run
          dist/claudebox-*.tar.gz
        if-no-files-found: error
