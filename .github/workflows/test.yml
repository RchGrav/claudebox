name: Test ClaudeBox

on:
  push:
    branches: [ main, refactor ]
  pull_request:
    branches: [ main ]

jobs:
  test-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Bash 3.2 compatibility tests
      run: |
        cd tests
        bash test_bash32_compat.sh
        
    - name: Run Docker Bash 3.2 tests (Linux only)
      if: runner.os == 'Linux'
      run: |
        cd tests
        bash test_in_bash32_docker.sh
        
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Run ShellCheck on all shell scripts
      run: |
        shellcheck -x main.sh lib/*.sh .builder/*.sh \
          build/docker-entrypoint build/init-firewall build/generate-tools-readme \
          tests/*.sh tooling/profiles/*.sh

  build:
    runs-on: ubuntu-latest
    needs: [test-compatibility, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build installer
      run: |
        bash .builder/build.sh
        
    - name: Verify installer and checksum backends
      run: |
        test -x dist/claudebox.run
        bash tests/test_installer_checksum.sh dist/claudebox.run

    - name: Test installer in temporary directory
      run: |
        TEST_HOME=$(mktemp -d)
        trap 'rm -rf "$TEST_HOME"' EXIT
        export HOME="$TEST_HOME"
        export PATH="$HOME/.local/bin:$PATH"
        bash dist/claudebox.run profiles
        test -f "$HOME/.claudebox/source/main.sh"
        test -L "$HOME/.local/bin/claudebox"
        bash dist/claudebox.run profiles
        "$HOME/.local/bin/claudebox" profiles

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: claudebox-tested-build
        path: dist/claudebox.run
        if-no-files-found: error
