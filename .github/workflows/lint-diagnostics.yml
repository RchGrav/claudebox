name: ShellCheck diagnostics

on:
  push:
    branches: [fix/shellcheck-clean]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture lint baseline and offline tools
        run: |
          mkdir -p /tmp/claudebox-lint-tools
          cp /usr/bin/shellcheck /tmp/claudebox-lint-tools/
          git bundle create /tmp/claudebox-lint-tools/repository.bundle --all
          shellcheck --version > /tmp/claudebox-lint-tools/version.txt
          if shellcheck -x -f json main.sh lib/*.sh > /tmp/claudebox-lint-tools/baseline.json; then
            printf '0\n' > /tmp/claudebox-lint-tools/lint-status.txt
          else
            printf '%s\n' "$?" > /tmp/claudebox-lint-tools/lint-status.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claudebox-lint-diagnostics
          path: /tmp/claudebox-lint-tools/
