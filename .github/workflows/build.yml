name: Build & Test Installer

on:
  push:
    branches: [refactor, main]
    tags:
      - 'v*'
  pull_request:
    branches: [refactor, main]
  release:
    types: [created, published]

jobs:
  test-installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build installer
        run: bash .builder/build.sh

      - name: Upload installer artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: claudebox-installer
          path: |
            dist/claudebox.run
            dist/claudebox-*.tar.gz
          if-no-files-found: error

      - name: Test installer in temporary directory
        run: |
          TEST_HOME=$(mktemp -d)
          trap 'rm -rf "$TEST_HOME"' EXIT
          export HOME="$TEST_HOME"
          printf 'Testing installation in %s\n' "$HOME"
          bash ./dist/claudebox.run profiles
          test -f "$HOME/.claudebox/source/main.sh"
          test -L "$HOME/.local/bin/claudebox"
          "$HOME/.local/bin/claudebox" profiles
          /bin/bash "$HOME/.claudebox/source/tests/test_bash32_compat.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_cli_bash32.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_command_sync.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_docker_runtime.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_dockerfile_generation.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_runtime_regressions.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_profile_download_failure.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_dockerfile_template.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_shell_robustness.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_python_install_status.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_shell_output.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_installer_checksum.sh" "$PWD/dist/claudebox.run"
          /bin/bash "$HOME/.claudebox/source/tests/test_slot_selection.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_clipboard_lifecycle.sh"
          /bin/bash "$HOME/.claudebox/source/tests/test_clipboard_firewall.sh"
          python3 -m unittest discover -s "$HOME/.claudebox/source/tests" -p test_clipboard_server.py
          node --test "$HOME/.claudebox/source/tests/test_clipboard_client.js"

  release:
    needs: test-installer
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build installer
        run: bash .builder/build.sh

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./dist/claudebox.run --clobber
